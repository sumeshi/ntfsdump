[project]
name = "ntfsdump"
dynamic = ["version"]
description = "A command-line tool for efficiently extracting files, directories, and alternate data streams directly from NTFS image files."
readme = "README.md"
license = "MIT"
authors = [
    { name = "sumeshi", email = "sum3sh1@protonmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    "pytsk3==20260715",
    "libewf-python==20260924",
    "libvmdk-python==20260714",
    "libvhdi-python==20260901",
]

[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ntfsdump/__about__.py"

[project.urls]
Homepage = "https://github.com/sumeshi/ntfsdump"
Repository = "https://github.com/sumeshi/ntfsdump"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "nuitka>=4.3.3",
    "pytest>=9.2.0",
    "zstandard>=0.25.0",
]

[project.scripts]
ntfsdump = 'ntfsdump.cli:main'

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pytsk3", "pyewf", "pyvhdi", "pyvmdk"]
ignore_missing_imports = true
